name: Build and deploy to gh-pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write  # needed to push to gh-pages

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false  # use token for pushing
          fetch-depth: 0  # needed to push to another branch

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy build to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Prepare a temporary worktree for gh-pages
          git fetch origin gh-pages || echo "No gh-pages branch yet"
          git worktree add gh-pages gh-pages || git worktree add gh-pages origin/gh-pages

          # Clear existing contents
          rm -rf gh-pages/*
          
          # Copy built docs
          cp -r docs/* gh-pages/

          cd gh-pages

          # Commit and push changes
          if git diff --quiet; then
            echo "No changes to deploy."
          else
            git add --all
            git commit -m "chore: update docs [skip ci]"
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:gh-pages
          fi
